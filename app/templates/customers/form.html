{% extends 'base.html' %}
{% block title %}{{ 'Nuevo Cliente' if not customer else 'Editar: ' + customer.name }}{% endblock %}
{% block content %}

<nav aria-label="breadcrumb" class="mb-1">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('customers.index') }}">Clientes</a></li>
    <li class="breadcrumb-item active">{{ 'Nuevo' if not customer else 'Editar' }}</li>
  </ol>
</nav>

<div class="page-header">
  <h1 class="page-title"><i class="bi bi-person-plus text-accent"></i> {{ 'Nuevo Cliente' if not customer else 'Editar Cliente' }}</h1>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre Completo / Razón Social <span class="text-danger">*</span></label>
              <input type="text" name="name" class="form-control" required value="{{ customer.name if customer else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Teléfono</label>
              <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ customer.email if customer else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">DNI / CUIT</label>
              <input type="text" name="cuit_dni" class="form-control" value="{{ customer.cuit_dni if customer else '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Dirección</label>
              <input type="text" name="address" class="form-control" value="{{ customer.address if customer else '' }}">
            </div>
            <div class="col-12">
              <label class="form-label">Notas</label>
              <textarea name="notes" class="form-control" rows="3">{{ customer.notes if customer else '' }}</textarea>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg"></i> Guardar
            </button>
            <a href="{{ url_for('customers.index') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
